[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairwise-af"
version = "0.2.2"
description = "Auditable paired-sample allele-read-fraction plots from VCF/BCF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "pysam>=0.22,<0.25", "cmcrameri>=1.8,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
plot-pairwise-af = "plot_pairwise_AF:main"

[tool.setuptools]
py-modules = ["plot_pairwise_AF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
