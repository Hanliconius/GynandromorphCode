  - bioconda
  - nodefaults

dependencies:
  - python=3.12
  - bcftools>=1.20
  - htslib>=1.20
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - openpyxl
  - git
  - curl
  - wget
  - gdown
  - jq
  - r-base=4.4
  - r-argparse
  - r-dplyr
  - r-readr
  - r-tidyr
  - r-purrr
  - r-ggplot2
  - r-ggrepel
  - r-scales
  - r-patchwork
  - r-cowplot
  - r-ragg
  - r-svglite
